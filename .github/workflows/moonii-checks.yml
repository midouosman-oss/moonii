name: Moonii checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Localization coverage audit
        run: npm run audit:localization
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo diagnostics
        run: npx expo-doctor
